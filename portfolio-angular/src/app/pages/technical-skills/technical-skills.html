<main class="technical-skills">
  <h2 class="heading">{{ content().heading }} <span>{{ content().headingSpan }}</span></h2>
  <p class="technical-skills-intro">{{ content().intro }}</p>

  <section class="skills-grid" aria-label="Technical skills by area">
    @for (skill of content().skills; track skill.title) {
      <app-skill-card
        [icon]="skill.icon"
        [title]="skill.title"
        [tags]="skill.tags"
        [description]="skill.description"
      />
    }
  </section>
</main>

<app-footer />
