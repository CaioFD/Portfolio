<section class="educacao">
  <h2 class="heading">{{ content().heading }} <span>{{ content().headingSpan }}</span></h2>

  <div class="educacao-container">
    @for (item of content().education; track item.title) {
      <app-info-card
        icon="bx bxs-graduation"
        [title]="item.title"
        [lines]="[item.institution, item.period, item.status]"
      />
    }
  </div>
</section>

<app-footer />
