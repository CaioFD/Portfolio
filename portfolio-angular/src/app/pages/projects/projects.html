<section class="experiencias">
  <h2 class="heading">My <span>Projects</span></h2>
  <div class="educacao-container">
    @for (project of projects; track project.url) {
      <app-info-card
        icon="bx bx-code-alt"
        [title]="project.title"
        [lines]="[project.description]"
        [href]="project.url"
      />
    }
  </div>
</section>

<app-footer />
