  <body>
    <header class="header">
      <a href="../Index.html" class="logo"><span>Caio</span>Diniz</a>

      <a href="#" class="contato">Contate-me</a>
    </header>

    <section class="contact-form">
      <h2 class="contact-me">Contate-<span>Me</span></h2>

      <form id="contact-form">
        <div class="input-box">
          <input
            type="text"
            name="name"
            id="name"
            placeholder="Nome Completo"
            required
          />
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Email"
            required
          />
        </div>

        <div class="input-box">
          <input
            type="tel"
            name="phone"
            id="phone"
            placeholder="Número de Telefone"
            required
          />
          <input
            type="text"
            name="subject"
            id="subject"
            placeholder="Assunto"
            required
          />
        </div>

        <textarea
          name="message"
          id="message"
          cols="30"
          rows="10"
          placeholder="Sua Mensagem"
          required
        ></textarea>
        <input
          type="submit"
          value="Enviar Mensagem"
          class="button-1"
          id="submit-btn"
        />
      </form>

      <div
        id="loading"
        style="display: none; text-align: center; margin-top: 20px"
      >
        <p>Enviando mensagem...</p>
      </div>
    </section>

    <footer class="footer-black">
      <div class="social">
        <a href="https://www.instagram.com/caiofd13/"

    </footer>
