<section class="contact-form">
  <h2 class="contact-me">{{ content().heading }} <span>{{ content().headingSpan }}</span></h2>

  <form #contactForm (ngSubmit)="onSubmit()">
    <div class="input-box">
      <input
        type="text"
        name="name"
        id="name"
        [placeholder]="content().namePlaceholder"
        required
        [(ngModel)]="name"
      />
      <input
        type="email"
        name="email"
        id="email"
        [placeholder]="content().emailPlaceholder"
        required
        [(ngModel)]="email"
      />
    </div>

    <div class="input-box">
      <input
        type="tel"
        name="phone"
        id="phone"
        [placeholder]="content().phonePlaceholder"
        required
        [(ngModel)]="phone"
      />
      <input
        type="text"
        name="subject"
        id="subject"
        [placeholder]="content().subjectPlaceholder"
        required
        [(ngModel)]="subject"
      />
    </div>

    <textarea
      name="message"
      id="message"
      cols="30"
      rows="10"
      [placeholder]="content().messagePlaceholder"
      required
      [(ngModel)]="message"
    ></textarea>
    <input
      type="submit"
      [value]="sending() ? content().sending : content().send"
      class="button-1"
      id="submit-btn"
      [disabled]="sending()"
    />
  </form>

  @if (sending()) {
    <div id="loading">
      <p>{{ content().sendingMessage }}</p>
    </div>
  }
</section>

<app-footer />
